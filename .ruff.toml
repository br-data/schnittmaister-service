# Exclude a variety of commonly ignored directories.
exclude = [".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120 # max length of a line
indent-width = 4 # number of spaces to indent

# The Python version of the project, see .python-version
target-version = "py312"

[lint]
select = [
    "ANN", # Annotation rules
    "B", # Bugs
    "C", # Complexity
    "D", # Documentation
    "E", # Errors
    "F", # Formatter
    "I", # Imports
]

# Those Rules are ignored
ignore = [
    "D401", # Checks for docstring first lines that are not in an imperative mood.
    "D100", "D104", #No docstring in modules and packages
    "D105", "D107", # No Docstring in magic methods (like __del__, __init__) and class init
    "D203", # No blank lines before class
    "D212", # Checks for docstring summary lines that are not positioned on the first physical line of the docstring.
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# E402 Checks for imports that are not at the top of the file.
# D101, D102, D103 Checks for docstrings in public classes, methods and functions.
# ANN201, ANN204 Checks for return types
"__init__.py" = ["E402"]
"**/test*/**" = ["E402", "D101", "D102", "D103", "ANN201", "ANN202", "ANN204"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"